[project]
name = "sns"
version = "0.1.0"
description = "멀티에이전트 기반 자율 SNS 성장 엔진"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44",
    "deepagents>=0.7.5",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sns"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

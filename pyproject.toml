[project]
name = "sns"
version = "0.1.0"
description = "멀티에이전트 기반 자율 SNS 성장 엔진"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=44",
    "deepagents>=0.7.5",
    "fastapi>=0.115",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "google-cloud-texttospeech>=2.37.0",
    "langchain-google-genai>=4.3.3",
    "langchain-openai>=1.1.7",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.2",
    "pygments>=2.20.0",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8",
    "python-dotenv>=1.2.3",
    "httpx>=0.27",
    "types-pygments>=2.21.0.20260819",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sns"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

# 구글 클라이언트 3종은 타입 스텁 미제공 — 어댑터 경계에서만 Any 허용.
[[tool.mypy.overrides]]
module = [
    "googleapiclient.*",
    "google_auth_oauthlib.*",
    "google.cloud.texttospeech",
    "google.oauth2.*",
    "google.auth.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ 진입점의 순수 배선(포맷·모드 매핑)을 테스트가 import한다. 스크립트라 통째로는
# 못 돌리지만, 매핑을 틀리면 되돌릴 수 없는 사고가 난다(manual 채널이 자동 발행되는 것처럼).
pythonpath = ["."]
